</script><script>(()=>{'use strict';
const roster=window.ROSTER_SKILLS,$=id=>document.getElementById(id),canvas=$('fx'),ctx=canvas.getContext('2d'),cache=new Map(),all=roster.flatMap((hero,hi)=>hero.skills.map((skill,si)=>({hi,si,hero,skill})));let hi=0,si=0,t=0,last=0,raf=0,running=false,paused=false,queue=false,generation=0,ready=false;const clamp=x=>Math.max(0,Math.min(1,x)),mix=(a,b,p)=>a+(b-a)*p;

const load=src=>{if(cache.has(src))return Promise.resolve(cache.get(src));return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>{cache.set(src,im);resolve(im)};im.onerror=()=>reject(Error('素材加载失败：'+src));im.src=src})};
function summary(s){if(s.mode==='heal'||s.mode==='toilet')return '恢复18 HP';let x=s.amount+'伤害';if(s.mode==='double')x='14×2伤害';if(s.mode==='triple')x='14×3伤害';if(s.mode==='debuff'||s.mode==='cheers')x+=' · 对手下次伤害−30%';if(s.mode==='buff')x+=' · 自身下次伤害+30%';if(s.mode==='drain')x+=' · 吸血50%，最多8';if(s.mode==='rage')x+=' · 下次命中−20个百分点';if(s.mode==='stun')x+=' · 跳过下次行动';return x}

async function play(h,s,chain){const token=++generation;cancelAnimationFrame(raf);hi=h;si=s;queue=chain;running=false;paused=false;last=0;t=0;cards();clean();$('status').textContent='加载 '+roster[hi].skills[si].name+'…';try{await Promise.all([load(roster[hi].idle),load(roster[hi].skills[si].art)]);if(token!==generation)return;running=true;$('pause').disabled=false;$('pause').textContent='暂停';$('cards').children[si].classList.add('active');$('description').textContent=roster[hi].name+' · '+roster[hi].skills[si].name+'：'+summary(roster[hi].skills[si]);render();raf=requestAnimationFrame(tick)}catch(e){if(token===generation){queue=false;$('status').textContent=e.message}}}
function pixelText(text,x,y,color='#ffe49b'){ctx.fillStyle='#192727';ctx.fillText(text,x+2,y+2);ctx.fillStyle=color;ctx.fillText(text,x,y)}

if(m==='toilet'&&active)bubble('Z z z…');if(heal){dy=Math.sin(t/170)*2;if(active){wave(A,Y-.1*H,(t%450)/450,'#96e699',1);if(t>=1400)pixelText('+18',A-30,Y-70-clamp((t-1400)/1000)*35,'#b5ff9a')}}

if(['code','window'].includes(m)&&active){if(m==='window'){bubble('要不是因为你脚上有美甲就不和你说话了');const q=clamp((t-600)/650),x=mix(A,B-120,q),y=Y-100;ctx.fillStyle='#9bb9a3';ctx.fillRect(x,y,180,115);ctx.strokeStyle='#162c24';ctx.lineWidth=5;ctx.strokeRect(x,y,180,115);ctx.fillStyle='#344f43';ctx.fillRect(x+3,y+3,174,24);ctx.font='18px monospace';pixelText('ACCESS DENIED',x+10,y+70,'#203b30')}else{for(let i=0;i<4;i++){const q=(t-500-i*100)/650;if(q>=0&&q<1)pixelText(['{}','01','</>',';'][i],mix(A,B,q),Y-30+i*16,'#a7f79f')}}}
if(h.id==='tropical-fish'&&m==='double'&&active){const q=t/140;ctx.strokeStyle='#e4dcc7';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(A+dx+25,Y+10,50,22,q,0,Math.PI*1.8);ctx.stroke();ctx.fillStyle='#b77f48';ctx.fillRect(A+dx+25+Math.cos(q)*50-7,Y+10+Math.sin(q)*22-7,14,14)}
if(['hang','cheers'].includes(m)&&t>=1200&&t<1900){$('enemy').style.transform=`rotate(${-8*Math.sin((t-1200)/700*Math.PI)}deg)`}
if(m==='throw'&&t>=1000&&t<1450){ctx.strokeStyle='#eee8d7';ctx.lineWidth=9;ctx.beginPath();ctx.ellipse(B,Y-5,45,23,-.2,0,Math.PI*2);ctx.stroke()}

if(!heal){const impact=impacts.findLast(x=>t>=x&&t-x<350);if(impact!==undefined){const q=(t-impact)/350,im=cache.get(hits[Math.min(6,Math.floor(q*7))]);if(im)ctx.drawImage(im,B-55,Y-65,110,110);if(m!=='throw')$('enemy').style.transform=`translateX(${Math.sin(q*24)*(1-q)*14}px)`;$('enemy').style.filter=Math.floor(q*7)%2?'':'brightness(2.5)';pixelText('−'+(['double','triple'].includes(m)?14:s.amount),B-20,Y-75-q*35)}if(t>=1500){let badge='';if(m==='debuff'||m==='cheers')badge='下次攻击伤害 −30%';if(m==='buff')badge='自身下次攻击伤害 +30%';if(m==='rage')badge='下次命中 −20个百分点';if(m==='stun')badge='眩晕 · 跳过下次行动';if(badge){$('badge').hidden=false;$('badge').textContent=badge}if(m==='stun'){for(let i=0;i<3;i++)pixelText('★',B+Math.cos(t/200+i*2)*35,Y-100+Math.sin(t/200+i*2)*10,'#ffe796')}}}
