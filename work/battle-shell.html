<link rel="stylesheet" href="assets/mano-skill.css"><link rel="stylesheet" href="assets/character-standard.css"><link rel="stylesheet" href="assets/battle-game.css"><body><main><header><div class="brand">跳海 · 朋友对战<small>FRIENDS FIGHT NIGHT</small></div><div class="controls"><button id="play">▶ 预览待机</button><button id="auto">一键连播：关</button><button class="speed active">1×</button><button class="speed">2×</button><button class="speed">4×</button><button class="speed">8×</button><button id="mute">音效：待接入</button></div></header>

<script>
const data=[{name:'Mano',skills:[['我烟呢？','低头捡烟却平地摔，整个人飞出去撞向对手。','伤害 24 · 命中 100%'],['怎么全掉了','电子烟、手机、钥匙依次飞出，造成三段伤害。','伤害 9 × 3 · 命中 95%'],['抽一口','抽一口，恢复少量生命。','恢复 18 HP'],['大烟杆子出离愤怒','平地摔引发装备爆飞，最后本人滑撞。','伤害 42 · 行动两次后解锁 · 每场一次']]},{name:'通风橱',skills:[['夏洛克三连刺','肉肠快速连刺三下，算一次行动。','伤害 9 × 3 · 命中 95%'],['吃肠','咬一口肉肠，恢复少量生命。','恢复 18 HP'],['塞你嘴里','造成伤害，并降低对手下一次攻击伤害。','伤害 15 · 下次攻击伤害 −30%'],['肠控全场','用肉肠打碟，发出三道节拍冲击波。','伤害 14 × 3 · 行动两次后解锁 · 每场一次']]}];
document.querySelector('#decks').innerHTML=data.map(d=>`<section class="deck"><div class="deck-head">${d.name}<small>普通技不可连续重复 · 大招未解锁</small></div><div class="cards">${d.skills.map((s,i)=>`<button class="card ${i===3?'ult':''}" data-owner="${d.name}" data-skill="${s[0]}"><strong>${s[0]} ${i===3?'✦':''}</strong><p>${s[1]}</p><small>${s[2]}</small></button>`).join('')}</div></section>`).join('');
document.querySelectorAll('.card').forEach(b=>b.onclick=()=>{document.querySelectorAll('.selected').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');document.querySelector('#announce').textContent=`${b.dataset.owner} 使用了「${b.dataset.skill}」！`;});
const variants=['A','B','C'],labels=['A · 酒馆竞技场','B · 双方聚光对决','C · 赛事转播台'];let index=Math.max(0,variants.indexOf(new URL(location.href).searchParams.get('variant')));function renderVariant(){document.body.classList.remove('variant-A','variant-B','variant-C');document.body.classList.add('variant-'+variants[index]);document.querySelector('#variantLabel').textContent=labels[index];const u=new URL(location.href);u.searchParams.set('variant',variants[index]);try{history.replaceState(null,'',u)}catch{}}function cycle(n){index=(index+n+3)%3;renderVariant()}document.querySelector('#prev').onclick=()=>cycle(-1);document.querySelector('#next').onclick=()=>cycle(1);onkeydown=e=>{if(e.target.closest('input,textarea,[contenteditable]'))return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1)};renderVariant();
document.querySelectorAll('.speed').forEach(b=>b.onclick=()=>{document.querySelectorAll('.speed').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelector('#announce').textContent='已选择 '+b.textContent+' · 原型仅预览控制条状态';});document.querySelector('#auto').onclick=function(){this.classList.toggle('active');this.textContent='一键连播：'+(this.classList.contains('active')?'开':'关');document.querySelector('#announce').textContent='连播状态预览 · 战斗引擎尚未接入';};let anim=[];document.querySelector('#play').onclick=function(){if(anim.length){anim.forEach(x=>x.cancel());anim=[];this.textContent='▶ 预览待机';return}document.querySelectorAll('.fighter').forEach(x=>anim.push(x.animate([{translate:'0 0'},{translate:'0 -4px'},{translate:'0 0'}],{duration:1400,iterations:Infinity})));this.textContent='Ⅱ 暂停待机';};document.querySelector('#mute').onclick=()=>document.querySelector('#announce').textContent='音效尚未接入 · 本页为静态布局与交互状态原型';
