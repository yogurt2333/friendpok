<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>朋友对战 · 12人瑞士轮</title><link rel="stylesheet" href="assets/roster-preview.css"><style>main{max-width:1100px}table{width:100%;border-collapse:collapse;background:#203b30}td,th{padding:12px;border-bottom:1px solid #6b896c;text-align:left}.faces{display:flex;flex-wrap:wrap;gap:12px}.faces figure{margin:0;text-align:center}.faces img{width:100px;height:110px;object-fit:contain;image-rendering:pixelated}iframe{width:100%;height:850px;border:2px solid #88ac83}#champion{font-size:28px;color:#ffe49b}button{margin:8px}a{color:#ffe49b}#now-skill{font-size:22px;color:#ffe49b;background:#203b30;padding:14px;border:2px solid #88ac83}#battle-stage{scroll-margin-top:12px}iframe{height:790px}nav{display:flex;align-items:center;flex-wrap:wrap;gap:10px}nav label{display:inline-flex;align-items:center;gap:5px}input[type=range]{width:100px}.faces img{width:68px;height:78px}.faces{gap:10px}.credit{font-size:12px}@media(max-width:600px){td,th{padding:7px;font-size:12px}iframe{height:860px}} </style><main><h1>朋友对战 · 十二好友瑞士轮</h1><p><a href="tournament.html" style="font-size:26px">⛶ 打开独立投屏比赛页</a></p><p>全员参加 4 轮，每轮 6 场。胜 1 分、负 0 分，无平局。优先同分配对，不重复交手。排名依次比较胜场、对手总分、累计剩余血量、赛前种子抽签顺序。四轮排名第一夺冠。</p><div class="faces" id="faces"></div><p><label>赛事种子 <input id="seed" type="number" min="0" max="4294967295"></label><button id="new">新建赛事</button><button id="next">开始第一轮</button><a href="全角色对战.html">自由对战</a> · <a href="new-skills.html">两位新角色技能图</a></p><section id="battle-stage"><h2 id="battle-title">准备开赛</h2><p id="now-skill" aria-live="polite">等待开赛</p><nav><button id="pause-battle" disabled>Ⅱ 暂停</button><label>播放速度 <select id="battle-speed"><option value="1">1倍</option><option value="2" selected>2倍</option><option value="4">4倍</option><option value="8">8倍</option></select></label><label><input id="music-toggle" type="checkbox" checked>音乐</label><label><input id="sfx-toggle" type="checkbox" checked>音效</label><label>音量 <input id="volume" type="range" min="0" max="0.6" step="0.01" value="0.25"></label><button id="unlock-audio">开启声音</button></nav><p id="notice" aria-live="polite"></p><iframe id="viewer" title="实时技能对战" allow="autoplay" hidden></iframe></section><p id="status"></p><p id="champion"></p><table><thead><tr><th>排名</th><th>角色</th><th>胜场</th><th>对手分</th><th>累计剩余HP</th></tr></thead><tbody id="table"></tbody></table><section id="rounds"></section><p>每轮六场自动依次播放，每场播完才计分。已结束的比赛可点击“重播”。刷新后点击“继续本轮战斗”从未完成的一场重新播放。</p><p class="credit">音乐：8-Bit Battle Loop / Theodore Kerr · CC0 · <a href="https://opengameart.org/content/8-bit-battle-loop" target="_blank" rel="noopener">来源</a></p></main><script src="assets/roster-skills.js"></script><script src="assets/battle-roster.js"></script><script src="assets/roster-battle-engine.js"></script><script src="assets/swiss-engine.js"></script><script src="assets/battle-audio.js"></script><script src="assets/swiss-ui.js"></script></html>
