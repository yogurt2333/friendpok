<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>热带鱼 · 剑玉摆锤校验</title>
<style>
@font-face{font-family:Pixel;src:url('assets/fusion-pixel-12px-zh_hans.woff2')}*{box-sizing:border-box}body{background:#71888a;color:#e9ead9;margin:0;font:18px Pixel,sans-serif}main{max-width:1100px;margin:auto;padding:24px}h1{font-weight:400}button,select{font:inherit;background:#c6cebd;border:3px solid #17292d;box-shadow:3px 3px #263b3c;padding:10px;color:#182a2a;cursor:pointer}button:disabled{opacity:.5}nav{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.arena{height:400px;background:#293e3c;border:4px solid #152b2d;position:relative;overflow:hidden;margin-top:24px}.disc{position:absolute;bottom:36px;width:30%;height:38px;background:#637874;border:4px solid #98aaa0;border-radius:50%}.disc.left{left:7%}.disc.right{right:7%}.sprite{position:absolute;bottom:45px;width:30%;height:285px;object-fit:contain;image-rendering:pixelated;transform-origin:center bottom}.actor{left:7%}.enemy{right:7%}.fx{position:absolute;left:69%;top:42%;width:100px;image-rendering:pixelated}.damage{position:absolute;left:73%;top:25%;font-size:30px;color:#ffe18b}.hp{position:absolute;right:5%;top:20px;width:34%;background:#182724;padding:8px;border:2px solid #9ea992}.hp i{display:block;background:#91c76b;height:12px;width:100%}.card{display:flex;align-items:center;gap:20px;margin-top:24px;border:4px solid #17292d;padding:16px;background:#344b47}.card img{width:160px;height:160px;object-fit:contain;image-rendering:pixelated}p{line-height:1.7}a{color:inherit}[hidden]{display:none!important}@media(max-width:650px){main{padding:12px}.arena{height:330px}.sprite{height:220px}.card img{width:110px}}
</style>
<main><h1>热带鱼 · 剑玉摆锤</h1><nav><button id="play" disabled>素材加载中</button><button id="pause" disabled>暂停</button><button id="reset">重置</button><select id="speed" aria-label="播放速度"><option value="1">1倍速</option><option value="2">2倍速</option><option value="4">4倍速</option><option value="8">8倍速</option></select></nav>
<p id="status" aria-live="polite">等待素材</p><section class="arena" aria-label="技能演出预览"><div class="disc left"></div><div class="disc right"></div><div class="hp">通风橱 <span id="hp">100 / 100</span><i id="bar"></i></div><img class="sprite actor" id="actor" src="assets/characters/tropical-fish/idle-v1.png" alt="热带鱼"><img class="sprite enemy" id="enemy" src="assets/tongfengchu-50-v2.png" alt="通风橱"><img class="fx" id="hit" hidden alt="命中星芒"><span class="damage" id="damage" hidden>−24</span></section>
<section class="card"><img src="assets/skills/tropical-swing.png" alt="剑玉摆锤技能图"><div><h2>剑玉摆锤</h2><p>甩出剑玉，木球撞击对手后收回。<br>基础伤害 24 · 命中率 100% · 一次行动约 2.8 秒</p></div></section><p>此页用于动作校验，固定命中并展示 24 点伤害；尚未接入正式对战随机结算。</p><p><a href="battle-prototype.html?variant=A">返回已验收的对战</a></p></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),idle='assets/characters/tropical-fish/idle-v1.png',attack='assets/skills/tropical-swing.png',hits=Array.from({length:7},(_,i)=>`assets/fx/hits-2-${i+1}.png`);let t=0,last=0,running=false,paused=false,frame=0;const duration=2800;
function render(){const reach=document.querySelector('.arena').clientWidth*.29;const attacking=t>=500&&t<2200;$('actor').src=attacking?attack:idle;$('actor').style.transform=t<500?`rotate(${-Math.sin(t/500*Math.PI)*8}deg)`:t<1250?`translateX(${Math.sin((t-500)/750*Math.PI/2)*reach}px) rotate(6deg)`:t<2200?`translateX(${reach*(1-(t-1250)/950)}px)`:'';const q=(t-1250)/420,hit=q>=0&&q<1;$('hit').hidden=!hit;$('damage').hidden=!(t>=1250&&t<2300);if(hit){$('hit').src=hits[Math.min(6,Math.floor(q*7))];$('enemy').style.transform=`translateX(${Math.sin(q*24)*(1-q)*16}px)`;$('enemy').style.filter=Math.floor(q*8)%2?'':'brightness(2)'}else{$('enemy').style.transform='';$('enemy').style.filter=''}$('damage').style.transform=`translateY(${-Math.max(0,t-1250)/30}px)`;$('hp').textContent=t>=1250?'76 / 100':'100 / 100';$('bar').style.width=t>=1250?'76%':'100%';$('status').textContent=t===0?'待命':t<500?'蓄力：摆动剑玉':t<1250?'挥出：剑玉甩向对手':t<1700?'命中：通风橱 −24 HP':t<2200?'收回剑玉，归位':t<duration?'回到待机':'演出结束 · 24 点伤害';}
function tick(now){if(!running)return;if(last&&!paused)t=Math.min(duration,t+(now-last)*Number($('speed').value));last=now;render();if(t===duration){running=false;$('pause').disabled=true;$('play').disabled=false;return}frame=requestAnimationFrame(tick)}
$('play').onclick=()=>{cancelAnimationFrame(frame);t=0;last=0;paused=false;running=true;$('pause').textContent='暂停';$('pause').disabled=false;$('play').disabled=true;render();frame=requestAnimationFrame(tick)};$('pause').onclick=()=>{paused=!paused;last=0;$('pause').textContent=paused?'继续':'暂停'};$('reset').onclick=()=>{cancelAnimationFrame(frame);t=0;last=0;running=false;paused=false;$('play').disabled=false;$('pause').disabled=true;$('pause').textContent='暂停';render()};document.addEventListener('visibilitychange',()=>{if(document.hidden&&running){paused=true;$('pause').textContent='继续'}});Promise.all([idle,attack,'assets/tongfengchu-50-v2.png',...hits].map(src=>new Promise((resolve,reject)=>{const im=new Image();im.onload=resolve;im.onerror=()=>reject(Error(src));im.src=src}))).then(()=>{$('play').disabled=false;$('play').textContent='▶ 剑玉摆锤';render()}).catch(e=>{$('status').textContent='素材加载失败：'+e.message});})();
</script></html>
